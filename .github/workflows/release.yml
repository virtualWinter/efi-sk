name: Release UEFI picker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Build release artifact
        run: |
          rustup target add x86_64-unknown-uefi
          tools/build-efi.sh
          mkdir dist
          cp build/BOOTX64.EFI dist/
          cp vendor/{memtest86plus/memtest86plus,edk2-shell/shell,keytool/KeyTool,ipxe/ipxe,acpidump/acpidump,gpt-fdisk/gdisk_x64}.efi dist/
          cp vendor/uefi-sct/sct-x64.7z dist/
          cd dist
          sha256sum *.efi *.EFI *.7z > SHA256SUMS
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
