name: Release EFI Swiss Knife

on:
  push:
    tags: ['v[0-9]*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: Build and package EFI tools
        run: |
          rustup target add x86_64-unknown-uefi
          tools/build-efi.sh
          mkdir -p dist build/efi-package
          cp build/BOOTX64.EFI build/efi-package/
          cp vendor/{memtest86plus/memtest86plus,edk2-shell/shell,keytool/KeyTool,ipxe/ipxe,acpidump/acpidump,gpt-fdisk/gdisk_x64}.efi build/efi-package/
          cp vendor/uefi-sct/sct-x64.7z build/efi-package/
          cp vendor/opnsense-geom/LICENSE build/efi-package/LICENSE.opnsense-geom
          cp assets/OFL-Geist.txt build/efi-package/
          tar -C build/efi-package -czf dist/efi-sk-efi-x86_64.tar.gz \
            BOOTX64.EFI acpidump.efi gdisk_x64.efi ipxe.efi KeyTool.efi \
            memtest86plus.efi shell.efi sct-x64.7z LICENSE.opnsense-geom OFL-Geist.txt
      - name: Install Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev
      - name: Build and test installer
        env:
          QMAKE: /usr/bin/qmake6
          EFI_SK_GITHUB_REPO: ${{ github.repository }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/installer
        run: |
          cargo test --locked --manifest-path installer/Cargo.toml
          cargo build --locked --release --manifest-path installer/Cargo.toml
      - name: Package installer, catalog, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/installer-package
          cp build/installer/release/efi-sk-installer installer/README.md LICENSE build/installer-package/
          tar -C build/installer-package -czf dist/efi-sk-installer-linux-x86_64.tar.gz \
            efi-sk-installer README.md LICENSE
          # The catalog workflow resolves upstream checksums before publishing.
          gh release download iso-catalog --pattern catalog.json --dir dist
          python3 -c 'import json; c=json.load(open("dist/catalog.json")); json.dump({"schema_version": c["schema_version"], "distros": c["distros"]}, open("dist/distros.json", "w"), indent=2)'
          cd dist
          sha256sum *.tar.gz *.json > SHA256SUMS
      - name: Publish GitHub release
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref_type == 'tag')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --latest --generate-notes dist/*
          fi
