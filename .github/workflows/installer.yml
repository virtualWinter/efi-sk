name: Release Linux installer

on:
  push:
    tags: ['installer-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev
      - name: Build and test installer
        env:
          QMAKE: /usr/bin/qmake6
          EFI_SK_GITHUB_REPO: ${{ github.repository }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/installer
        run: |
          cargo test --locked --manifest-path installer/Cargo.toml
          cargo build --locked --release --manifest-path installer/Cargo.toml
      - name: Package installer
        run: |
          mkdir -p dist package
          cp build/installer/release/efi-sk-installer package/
          cp installer/README.md LICENSE package/
          archive="efi-sk-installer-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -C package -czf "dist/$archive" efi-sk-installer README.md LICENSE
          cd dist
          sha256sum "$archive" > SHA256SUMS
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --generate-notes dist/*
